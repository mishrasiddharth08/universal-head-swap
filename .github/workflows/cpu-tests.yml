name: CPU regression tests
on:
  workflow_dispatch:
  push:
    paths: ['khs/**', 'scripts/klein_face_reference.py', 'tests/**', 'requirements-test.txt', '.github/workflows/cpu-tests.yml']
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-test.txt
      - run: python -B -m unittest discover -s tests -v
        env:
          GRADIO_ANALYTICS_ENABLED: 'False'
