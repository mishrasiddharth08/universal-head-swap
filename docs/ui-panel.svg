<text x="52" y="423" font-size="17" fill="#e6edf3" font-weight="700">Edit area: Head only / Whole image</text>
<text x="52" y="449" font-size="15" fill="#58a6ff" font-weight="400">Preview setup → inspect mask → press Forge Generate</text>
