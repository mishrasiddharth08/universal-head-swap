<text x="52" y="321" font-size="15" fill="#e6edf3" font-weight="400">Add 1–20 identity references</text>
<text x="52" y="348" font-size="13" fill="#8b949e" font-weight="400">Similar pose and lighting work best.</text>
<rect x="396" y="164" width="532" height="99" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="416" y="194" font-size="18" fill="#e6edf3" font-weight="700">Head-swap LoRA (BFS) · Auto</text>
<text x="416" y="223" font-size="15" fill="#e6edf3" font-weight="400">Matches Qwen 2.1 / Klein 9B / Klein 4B</text>
<text x="416" y="247" font-size="13" fill="#8b949e" font-weight="400">Qwen: prefers installed BFS v1.1 Alternative</text>
