<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Universal Head Swap — four-tab UI guide</title>
<desc id="desc">Choose headshots, an automatically matched BFS LoRA and optional character LoRA in Swap. Appearance, Quality and mask, and Settings contain advanced controls. Qwen companion supports model reuse and full batch progress. Layout illustration, September 28, 2026.</desc>
