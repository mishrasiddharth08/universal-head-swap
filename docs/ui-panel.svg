<title id="title">Universal Head Swap six-tab UI guide</title><desc id="desc">Six tabs with automatic BFS matching for Klein, Qwen and Krea2 plus separate Z-Image/SAM3 and Krea2 tabs.</desc><rect width="960" height="720" rx="10" fill="#0d1117" stroke="#30363d"/><text x="32" y="45" font-size="27" fill="#e6edf3" font-weight="700">Universal Head Swap</text><text x="32" y="73" font-size="14" fill="#8b949e">Six focused tabs - native Forge Generate - 3 October 2026</text>
<g fill="#21262d" stroke="#30363d"><rect x="32" y="96" width="136" height="46" rx="10" fill="#1f6feb"/><rect x="184" y="96" width="136" height="46" rx="10"/><rect x="336" y="96" width="136" height="46" rx="10"/><rect x="488" y="96" width="136" height="46" rx="10"/><rect x="640" y="96" width="136" height="46" rx="10"/><rect x="792" y="96" width="136" height="46" rx="10"/></g>
