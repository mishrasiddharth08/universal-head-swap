<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Universal Head Swap five-tab UI guide</title><desc id="desc">Five tabs with automatic BFS matching for Klein, Qwen and Krea2 plus a separate Z-Image and SAM3 tab.</desc><rect width="960" height="720" rx="10" fill="#0d1117" stroke="#30363d"/><text x="32" y="45" font-size="27" fill="#e6edf3" font-weight="700">Universal Head Swap</text><text x="32" y="73" font-size="14" fill="#8b949e">Five focused tabs - native Forge Generate - 3 October 2026</text>
<g fill="#21262d" stroke="#30363d"><rect x="32" y="96" width="166" height="46" rx="10" fill="#1f6feb"/><rect x="214" y="96" width="166" height="46" rx="10"/><rect x="396" y="96" width="166" height="46" rx="10"/><rect x="578" y="96" width="166" height="46" rx="10"/><rect x="760" y="96" width="168" height="46" rx="10"/></g>
<g fill="#e6edf3" font-size="14" font-weight="700"><text x="47" y="125">1 - Swap</text><text x="229" y="125">2 - Z-Image</text><text x="411" y="125">3 - Appearance</text><text x="593" y="125">4 - Quality</text><text x="775" y="125">5 - Settings</text></g>
<rect x="32" y="164" width="344" height="212" rx="10" fill="#161b22" stroke="#30363d"/><text x="52" y="195" font-size="18" fill="#e6edf3" font-weight="700">Headshots</text><g fill="#21262d" stroke="#30363d"><rect x="52" y="216" width="62" height="72" rx="10"/><rect x="128" y="216" width="62" height="72" rx="10"/><rect x="204" y="216" width="62" height="72" rx="10"/><rect x="280" y="216" width="62" height="72" rx="10"/></g><text x="52" y="321" font-size="15" fill="#e6edf3">Add 1-20 identity references</text><text x="52" y="348" font-size="13" fill="#8b949e">Source image stays first; headshot is second.</text>
<rect x="396" y="164" width="532" height="99" rx="10" fill="#161b22" stroke="#30363d"/><text x="416" y="194" font-size="18" fill="#e6edf3" font-weight="700">Head-swap LoRA (BFS) - Auto</text><text x="416" y="223" font-size="15" fill="#e6edf3">Matches Klein, Qwen 2.1 and Krea2</text><text x="416" y="247" font-size="13" fill="#8b949e">Krea2: exact BFS v1.1, including nested folders</text>
<rect x="396" y="279" width="532" height="97" rx="10" fill="#161b22" stroke="#30363d"/><text x="416" y="310" font-size="18" fill="#e6edf3" font-weight="700">Character LoRA - optional</text><text x="416" y="339" font-size="14" fill="#e6edf3">Required for Z-Image; optional matching LoRA elsewhere.</text><text x="416" y="362" font-size="13" fill="#8b949e">Krea2 BFS is model-only at strength 1.</text>
<rect x="32" y="394" width="896" height="82" rx="10" fill="#161b22" stroke="#30363d"/><text x="52" y="423" font-size="17" fill="#e6edf3" font-weight="700">Krea2 exact trigger</text><text x="52" y="450" font-size="15" fill="#d2a8ff">head_swap: replace the head with the reference head.</text>
<rect x="32" y="496" width="280" height="108" rx="10" fill="#161b22" stroke="#30363d"/><text x="48" y="526" font-size="17" fill="#e6edf3" font-weight="700">Z-Image &amp; SAM3</text><text x="48" y="554" font-size="13" fill="#8b949e">Separate masked-inpaint route</text><text x="48" y="578" font-size="13" fill="#8b949e">Automatic SAM3 head masks.</text>
<rect x="328" y="496" width="280" height="108" rx="10" fill="#161b22" stroke="#30363d"/><text x="344" y="526" font-size="17" fill="#e6edf3" font-weight="700">Appearance + Quality</text><text x="344" y="554" font-size="13" fill="#8b949e">Cleanup, protected mask, finishing</text><text x="344" y="578" font-size="13" fill="#8b949e">Review outputs at 100% zoom.</text>
<rect x="624" y="496" width="304" height="108" rx="10" fill="#161b22" stroke="#30363d"/><text x="640" y="526" font-size="17" fill="#e6edf3" font-weight="700">Settings</text><text x="640" y="554" font-size="13" fill="#8b949e">Memory profiles, saved setups</text><text x="640" y="578" font-size="13" fill="#8b949e">Generation reports</text>
<text x="32" y="646" font-size="15" fill="#58a6ff" font-weight="700">Krea2 start: Euler / Simple - 8 steps - CFG 1 - denoise 1</text><text x="32" y="676" font-size="13" fill="#8b949e">Raw Krea2 guidance from upstream: about 40 steps and CFG 3-4. GPU and visual validation remain pending.</text>
