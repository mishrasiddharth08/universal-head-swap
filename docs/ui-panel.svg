<text x="416" y="339" font-size="14" fill="#e6edf3" font-weight="400">Required for Z-Image; optional for Klein / Qwen.</text>
<text x="416" y="362" font-size="13" fill="#8b949e" font-weight="400">Strengths and trigger: expand LoRA controls.</text>
