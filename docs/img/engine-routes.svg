<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Automatic engine routing</title><desc id="desc">The loaded Forge checkpoint selects Klein, Qwen 2.1, Krea2 or Z-Image.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker></defs><rect width="960" height="500" rx="12" fill="#0d1117" stroke="#30363d"/><text x="480" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">How the loaded engine picks the route</text>
<rect x="45" y="88" width="210" height="70" rx="10" fill="#161b22" stroke="#30363d"/><text x="150" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Source + identity</text><text x="150" y="140" text-anchor="middle" font-size="11.5" fill="#8b949e">img2img - normal Generate</text>
<rect x="330" y="78" width="250" height="90" rx="10" fill="#1c2128" stroke="#58a6ff"/><text x="455" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#58a6ff">Which checkpoint is loaded?</text><text x="455" y="136" text-anchor="middle" font-size="11.5" fill="#8b949e">automatic engine and family detection</text><line x1="255" y1="123" x2="326" y2="123" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#a)"/>
<g fill="#161b22"><rect x="660" y="62" width="260" height="82" rx="10" stroke="#3fb950"/><rect x="660" y="158" width="260" height="82" rx="10" stroke="#3fb950"/><rect x="660" y="254" width="260" height="98" rx="10" stroke="#d2a8ff"/><rect x="660" y="366" width="260" height="82" rx="10" stroke="#f78166"/></g>
<g text-anchor="middle"><text x="790" y="88" font-size="13.5" font-weight="700" fill="#3fb950">FLUX.2 Klein 4B / 9B</text><text x="790" y="112" font-size="11.5" fill="#e6edf3">size-matched BFS + latents</text><text x="790" y="184" font-size="13.5" font-weight="700" fill="#3fb950">Qwen Image Edit 2.1</text><text x="790" y="208" font-size="11.5" fill="#e6edf3">Project Invisible bridge + BFS</text><text x="790" y="280" font-size="13.5" font-weight="700" fill="#d2a8ff">Krea2</text><text x="790" y="304" font-size="11.5" fill="#e6edf3">BFS + Krea2 character LoRA</text><text x="790" y="328" font-size="10.5" fill="#8b949e">Euler / Simple - 8 steps - CFG 1</text><text x="790" y="392" font-size="13.5" font-weight="700" fill="#f78166">Z-Image Turbo / Base</text><text x="790" y="416" font-size="11.5" fill="#e6edf3">character LoRA + optional SAM3</text></g>
<g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"><line x1="580" y1="105" x2="656" y2="103"/><line x1="580" y1="120" x2="656" y2="199"/><line x1="580" y1="135" x2="656" y2="302"/><line x1="580" y1="150" x2="656" y2="407"/></g>
<text x="480" y="478" text-anchor="middle" font-size="11" fill="#8b949e">Use family-matched LoRAs. Protected edits preserve mask-zero pixels. Native Forge Spectrum remains available.</text>
</svg>
