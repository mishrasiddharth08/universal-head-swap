<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Universal Head Swap — extension overview</title>
<desc id="desc">One-panel overview of the extension: four control tabs, three engine routes, safety and memory features, and the img2img Generate button path.</desc>
<defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#111a2b"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff"/>
    <stop offset="1" stop-color="#3fb950"/>
  </linearGradient>
</defs>
<rect width="960" height="560" rx="12" fill="url(#bg3)" stroke="#30363d"/>
<rect x="0" y="0" width="960" height="4" rx="2" fill="url(#bar)"/>
<text x="480" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#e6edf3">Universal Head Swap — at a glance</text>

<!-- Left column: the panel tabs -->
<g>
  <rect x="40" y="70" width="420" height="380" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="100" font-size="15" font-weight="700" fill="#58a6ff">ONE COLLAPSED PANEL (img2img tab)</text>
  <rect x="60" y="116" width="380" height="64" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="76" y="142" font-size="13" font-weight="600" fill="#e6edf3">1 · Swap</text>
  <text x="76" y="164" font-size="11.5" fill="#8b949e">headshots pool · BFS adapter · character LoRA · strengths</text>
  <rect x="60" y="192" width="380" height="64" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="76" y="218" font-size="13" font-weight="600" fill="#e6edf3">2 · Appearance</text>
  <text x="76" y="240" font-size="11.5" fill="#8b949e">cleanup · hairstyle · expression · Identity-only mode</text>
  <rect x="60" y="268" width="380" height="64" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="76" y="294" font-size="13" font-weight="600" fill="#e6edf3">3 · Quality &amp; mask</text>
  <text x="76" y="316" font-size="11.5" fill="#8b949e">proportions · protected mask · detail · finishing</text>
  <rect x="60" y="344" width="380" height="64" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="76" y="370" font-size="13" font-weight="600" fill="#e6edf3">4 · Settings</text>
  <text x="76" y="392" font-size="11.5" fill="#8b949e">memory profiles (6/8 GB+) · saved setups · reports</text>
</g>

<!-- Right column: routes + safety -->
<g>
  <rect x="490" y="70" width="430" height="178" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="510" y="98" font-size="15" font-weight="700" fill="#3fb950">THREE ENGINES, AUTO-SELECTED</text>
  <text x="510" y="126" font-size="12.5" fill="#e6edf3" font-weight="600">FLUX.2 Klein 4B/9B</text>
  <text x="700" y="126" font-size="11.5" fill="#8b949e">BFS LoRA + reference latents</text>
  <text x="510" y="152" font-size="12.5" fill="#e6edf3" font-weight="600">Qwen Image Edit 2.1</text>
  <text x="700" y="152" font-size="11.5" fill="#8b949e">Project Invisible bridge · BFS</text>
  <text x="510" y="178" font-size="12.5" fill="#e6edf3" font-weight="600">Z-Image Turbo / Base</text>
  <text x="700" y="178" font-size="11.5" fill="#8b949e">character LoRA inpaint + SAM3</text>
  <text x="510" y="216" font-size="11" fill="#8b949e">Loaded checkpoint picks the route — no mode switch.</text>
  <text x="510" y="234" font-size="11" fill="#8b949e">BFS family-locked: Klein adapters never load on Qwen.</text>
</g>
<g>
  <rect x="490" y="264" width="430" height="186" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="510" y="292" font-size="15" font-weight="700" fill="#d29922">BUILT-IN SAFEGUARDS</text>
  <text x="510" y="318" font-size="11.5" fill="#e6edf3">✓ Protected-head mask keeps body &amp; scene intact</text>
  <text x="510" y="342" font-size="11.5" fill="#e6edf3">✓ Alignment rejected if width/position worsen</text>
  <text x="510" y="366" font-size="11.5" fill="#e6edf3">✓ Optional face-match checks in generation report</text>
  <text x="510" y="390" font-size="11.5" fill="#e6edf3">✓ Bounded reference budgets · one OOM retry</text>
  <text x="510" y="414" font-size="11.5" fill="#e6edf3">✓ LoRAs stay on the runtime side path (never merged)</text>
  <text x="510" y="438" font-size="11.5" fill="#e6edf3">✓ No Forge core edits — remove folder = stock Forge</text>
</g>

<!-- bottom flow -->
<g>
  <rect x="40" y="470" width="880" height="56" rx="10" fill="#1c2128" stroke="#58a6ff"/>
  <text x="480" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Source photo  →  choose headshot (or character LoRA)  →  prompt  →  Generate</text>
  <text x="480" y="514" text-anchor="middle" font-size="11" fill="#8b949e">Everything inside Forge's normal img2img tab — seed, sampler and batch controls stay native</text>
</g>
</svg>
