<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Universal Head Swap banner</title><desc id="desc">Four automatically routed Forge engines: Klein, Qwen 2.1, Krea2 and Z-Image.</desc>
<rect width="960" height="220" rx="12" fill="#0d1117" stroke="#30363d"/><rect width="960" height="4" rx="2" fill="#58a6ff"/>
<text x="40" y="58" font-size="34" font-weight="700" fill="#e6edf3">Universal Head Swap</text><text x="40" y="86" font-size="15" fill="#8b949e">Four engines inside Forge Neo - one panel, one Generate button</text>
<text x="40" y="116" font-size="13" fill="#58a6ff">FLUX.2 Klein 4B/9B</text><text x="225" y="116" font-size="13" fill="#8b949e">BFS + reference latents</text>
<text x="40" y="142" font-size="13" fill="#3fb950">Qwen Image Edit 2.1</text><text x="225" y="142" font-size="13" fill="#8b949e">Project Invisible bridge + BFS</text>
<text x="40" y="168" font-size="13" fill="#d2a8ff">Krea2</text><text x="225" y="168" font-size="13" fill="#8b949e">BFS v1.1 + source and head reference</text>
<text x="40" y="194" font-size="13" fill="#f78166">Z-Image Turbo / Base</text><text x="225" y="194" font-size="13" fill="#8b949e">Character-LoRA inpaint + optional SAM3</text>
<rect x="620" y="54" width="300" height="126" rx="10" fill="#161b22" stroke="#30363d"/><text x="770" y="84" text-anchor="middle" font-size="13" fill="#e6edf3" font-weight="600">Loaded engine selects the route</text><text x="770" y="110" text-anchor="middle" font-size="12" fill="#8b949e">Family-safe adapter matching</text><text x="770" y="134" text-anchor="middle" font-size="12" fill="#8b949e">Native Forge Generate and gallery</text><text x="770" y="158" text-anchor="middle" font-size="12" fill="#3fb950">Independent community extension</text>
</svg>
